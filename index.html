/* Phase timing: elapsed, remaining, and warnings at 1 minute and 30 seconds */
function phaseClock(G) {
  if (!G || !G.phaseAt) return null;
  const ph = PHASES.find(x => x.k === G.phase); if (!ph || !ph.min) return null;
  const el = (S.rehearsal ? S.simNow : Date.now()) - G.phaseAt, left = ph.min * 60000 - el;
  return { ph, el, left, next: PHASES[PHASES.findIndex(x => x.k === G.phase) + 1] };
}
function clockText(c) {
  if (!c) return '';
  if (c.left <= 0) return 'Over time by ' + mmss(-c.left);
  if (c.left <= 60000) return mmss(c.left) + ' left';
  return mmss(c.el) + ' of ' + c.ph.min + ' min';
}
S.warned = new Set();
function tick() {
  const G = S.G, c = phaseClock(G);
  document.querySelectorAll('[data-timer]').forEach(n => { n.textContent = clockText(c); n.classList.toggle('late', !!c && c.left <= 60000); });
  document.querySelectorAll('[data-left]').forEach(n => { n.textContent = c ? (c.left > 0 ? mmss(c.left) : '+' + mmss(-c.left)) : '\u2014'; n.classList.toggle('late', !!c && c.left <= 60000); });
  if (!c || S.rehearsal || !S.loaded) return;
  [30, 60].forEach(th => {
    const key = G.phaseAt + ':' + th;
    if (th === 60 && S.warned.has(G.phaseAt + ':30')) S.warned.add(key);
    if (c.left <= th * 1000 && c.left > 0 && !S.warned.has(key)) {
      S.warned.add(key);
      const g = S.G.players[S.pid] ? S.G.players[S.pid].group : (S.G.guides[S.pid] ? S.G.guides[S.pid].group : null);
      const msg = (th === 60 ? '1 minute' : '30 seconds') + ' left in ' + c.ph.label;
      toast(S.host && c.next ? msg + '. Start ' + c.next.label + ' when the rooms are ready.' : msg, g);
    }
  });
}
setInterval(tick, 1000);

/* The script is written on a compact clock; stretch each phase to the session's
   timings (Gathering 5, Build 15, Win 10, Sustain 10 minutes). */
const SIM_PHASE_MAP = [[0, 60, 0, 300], [60, 480, 300, 1200], [480, 780, 1200, 1800], [780, 1080, 1800, 2400], [1080, 1200, 2400, 2520]];
function simTime(t) {
  const m = SIM_PHASE_MAP.find(([a, b]) => t >= a && t < b) || SIM_PHASE_MAP[SIM_PHASE_MAP.length - 1];
  return Math.round(m[2] + (t - m[0]) * (m[3] - m[2]) / (m[1] - m[0]));
}
function compileSim() {
  const refs = {}; let n = 0;
  return SIM_SCRIPT.map(step => {
    const evs = step.ev.map(([who, type, payload, ref]) => {
      const id = 'e' + String(++n).padStart(4, '0'), p = JSON.parse(JSON.stringify(payload));
      ['id', 'ruleId', 'reqId', 'lessonId'].forEach(k => { if (typeof p[k] === 'string' && p[k][0] === '@') p[k] = refs[p[k].slice(1)]; });
      if (ref) refs[ref] = id;
      return { id, pid: SP(who), type, payload: p, ts: SIM_BASE + simTime(step.t) * 1000 + n };
    });
    return Object.assign({}, step, { t: simTime(step.t), events: evs });
  });
}
function startRehearsal() {
  S.rehearsal = true; S.room = 'REHEARSAL'; S.loaded = true; S.host = false;
  S.sim = { steps: compileSim(), i: 0, tab: 'rooms', follow: true, sel: { cac: SP('Ana'), mac: SP('Ines'), cc: SP('Quinn') }, timer: null, phase: 'lobby' };
  S.ui.roleOpen = true;
  simGo(0);
}
function simGo(i) {
  const sim = S.sim; i = Math.max(0, Math.min(sim.steps.length - 1, i)); sim.i = i;
  S.events = sim.steps.slice(0, i + 1).flatMap(s => s.events);
  S.G = reduce(S.events);
  const step = sim.steps[i];
  S.simNow = SIM_BASE + step.t * 1000 + 999;
  S.fresh = new Set();
  step.events.forEach(e => { if (e.type === 'open_word') S.fresh.add('round-open'); if (e.type === 'close_word') S.fresh.add('round-close'); S.fresh.add(e.id); ['id', 'reqId', 'lessonId', 'ruleId', 'org'].forEach(k => { if (e.payload[k]) S.fresh.add(String(e.payload[k])); }); });
  if (S.G.phase !== sim.phase) { sim.phase = S.G.phase; S.ui.roleOpen = S.G.phase === 'lobby'; }
  if (sim.follow) {
    ['cac', 'mac', 'cc'].forEach(g => { const first = step.events.find(e => S.G.players[e.pid] && S.G.players[e.pid].group === g); if (first) sim.sel[g] = first.pid; });
    Object.entries(step.focus || {}).forEach(([g, n]) => { sim.sel[g] = SP(n); });
    sim.tab = step.tab || (S.G.phase === 'reveal' ? 'host' : 'rooms');
  }
  render();
}
function simPlay() {
  const sim = S.sim;
  if (sim.timer) { clearInterval(sim.timer); sim.timer = null; render(); return; }
  if (sim.i >= sim.steps.length - 1) simGo(0);
  sim.timer = setInterval(() => { if (S.sim.i >= S.sim.steps.length - 1) { clearInterval(S.sim.timer); S.sim.timer = null; render(); return; } simGo(S.sim.i + 1); }, 5000);
  render();
}
function rehearsalView() {
  const sim = S.sim, G = S.G, step = sim.steps[sim.i], ph = PHASES.find(p => p.k === G.phase), N = sim.steps.length;
  const col = g => {
    const sel = G.players[sim.sel[g]];
    const chips = SIM_PEOPLE[g].map(n => { const p = G.players[SP(n)]; if (!p) return ''; const on = SP(n) === sim.sel[g];
      return `<button class="chip${on ? ' on' : ''}" data-act="simSel" data-g="${g}" data-pid="${SP(n)}" aria-pressed="${on}" title="${esc(roleOf(p).name)}">${esc(n)}</button>`; }).join('');
    return `<section class="simcol" data-g="${g}">
      <h3 style="color:var(--g-ink);margin-bottom:6px">Group ${GROUPS[g].num}: ${GROUPS[g].name}</h3>
      <div class="chips">${chips || '<span class="small muted">No one has joined yet.</span>'}</div>
      ${sel ? `<p class="small muted" style="margin:6px 0">Showing ${esc(sel.name)}\u2019s screen, ${esc(roleOf(sel).name)}</p><div class="simframe phone">${playerView(sel)}</div>`
            : '<div class="simframe phone"><div class="wrap"><p class="muted">Waiting for people to join.</p></div></div>'}
    </section>`;
  };
  return `<header class="topbar"><div class="wrap wide"><div class="who">Rehearsal<span>A scripted example. Real participants make their own choices.</span></div>
      <div class="ph"><b>${esc(ph.label)}</b><span>Season time ${mmss(step.t * 1000)}</span></div></div></header>
    <main class="wrap wide">
      <section class="card simctl">
        <div class="row between">
          <div class="row">
            <button data-act="simPrev" ${sim.i ? '' : 'disabled'}>Back</button>
            <button class="primary" data-act="simPlay">${sim.timer ? 'Pause' : 'Play'}</button>
            <button data-act="simNext" ${sim.i < N - 1 ? '' : 'disabled'}>Next</button>
            <span class="small muted">Step ${sim.i + 1} of ${N}</span>
          </div>
          <div class="row">
            <label class="small" style="margin:0;font-weight:400;display:flex;gap:6px;align-items:center"><input type="checkbox" id="sim-follow" style="width:auto" ${sim.follow ? 'checked' : ''}> Follow the action</label>
            <button class="quiet" data-act="simExit">Leave rehearsal</button>
          </div>
        </div>
        <input type="range" id="sim-range" data-reset="1" min="0" max="${N - 1}" value="${sim.i}" aria-label="Jump to step" style="margin-top:10px;padding:0">
        <div class="narr" ${step.g ? `data-g="${step.g}"` : ''}>
          <div class="small" style="color:var(--g-ink);font-weight:700">${step.g ? 'Group ' + GROUPS[step.g].num + ': ' + GROUPS[step.g].name : 'All rooms'}</div>
          <p style="font-size:1.08rem;margin:.2em 0 .4em">${esc(step.say)}</p>
          ${step.talk ? `<p class="talk"><b>In the breakout room:</b> ${esc(step.talk)}</p>` : ''}
        </div>
      </section>
      <div class="row" role="tablist" style="margin:0 0 12px">
        <button role="tab" data-act="simTab" data-v="rooms" aria-selected="${sim.tab === 'rooms'}" class="${sim.tab === 'rooms' ? 'primary' : ''}">Breakout rooms</button>
        <button role="tab" data-act="simTab" data-v="guides" aria-selected="${sim.tab === 'guides'}" class="${sim.tab === 'guides' ? 'primary' : ''}">Breakout facilitators</button>
        <button role="tab" data-act="simTab" data-v="host" aria-selected="${sim.tab === 'host'}" class="${sim.tab === 'host' ? 'primary' : ''}">Lead facilitator</button>
      </div>
      ${sim.tab === 'rooms' ? `<div class="grid3">${col('cac')}${col('mac')}${col('cc')}</div>`
        : sim.tab === 'guides' ? `<div class="grid3">${['cac', 'mac', 'cc'].map(g => { const gd = Object.values(G.guides).find(x => x.group === g);
            return `<section class="simcol" data-g="${g}"><h3 style="color:var(--g-ink);margin-bottom:6px">Group ${GROUPS[g].num}: ${GROUPS[g].name}</h3>
              ${gd ? `<p class="small muted" style="margin:6px 0">${esc(gd.name)}\u2019s screen</p><div class="simframe phone">${guideView(gd)}</div>` : '<p class="muted">The breakout facilitator hasn\u2019t joined yet.</p>'}</section>`; }).join('')}</div>`
        : `<div class="simframe hostframe">${hostView()}</div>`}
    </main>`;
}
Object.assign(A, {
  rehearse() { startRehearsal(); },
  simNext() { simGo(S.sim.i + 1); },
  simPrev() { simGo(S.sim.i - 1); },
  simPlay() { simPlay(); },
  simTab(d) { S.sim.tab = d.v; render(); },
  simSel(d) { S.sim.sel[d.g] = d.pid; S.sim.follow = false; render(); },
  simExit() { if (S.sim.timer) clearInterval(S.sim.timer); S.rehearsal = false; S.sim = null; S.room = null; S.events = []; S.G = emptyGame(); S.fresh = new Set(); history.replaceState(null, '', location.pathname); render(); }
});
document.addEventListener('change', e => {
  if (!S.rehearsal) return;
  if (e.target.id === 'sim-range') simGo(+e.target.value);
  if (e.target.id === 'sim-follow') { S.sim.follow = e.target.checked; if (S.sim.follow) simGo(S.sim.i); }
});
document.addEventListener('keydown', e => {
  if (!S.rehearsal || (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== 'range')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); simGo(S.sim.i + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); simGo(S.sim.i - 1); }
});

  const q = new URLSearchParams(location.search), room = (q.get('room') || '').trim().toUpperCase(), circle = (q.get('circle') || '').toLowerCase();
  if (GROUPS[circle]) S.circle = circle;
  if (q.get('role') === 'facilitator' && GROUPS[circle]) S.guide = true;
  if (room) enterRoom(room); else render();
})();
</script>
